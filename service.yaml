apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hotel-concierge-voice-agent
  labels:
    cloud.googleapis.com/location: us-west4
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # STRICT DEPENDENCY: Forces Voice Agent to wait for MCP Server to fully boot first
        run.googleapis.com/container-dependencies: '{"voice-agent":["mcp-server"]}'
        autoscaling.knative.dev/minScale: "1"
    spec:
      serviceAccountName: 314181581663-compute@developer.gserviceaccount.com
      containers:
        # ====================================================
        # 1. PRIMARY: Voice Agent (FastAPI / Pipecat)
        # No 'command' override here! It uses your Dockerfile's CMD
        # ====================================================
        - name: voice-agent
          image: us-west4-docker.pkg.dev/gen-lang-client-0063140545/cloud-run-source-deploy/hotel-concierge-voice-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: SUPABASE_URL
              value: "https://evabhvbuvauttgvzplpf.supabase.co"
            - name: POST_CALL_WEBHOOK_URL
              value: "https://hotel-postcall-agents-314181581663.us-west4.run.app/webhook/process-call"
            - name: TWILIO_ACCOUNT_SID
              value: "ACc5dea6006945f47d713186606fb64412"
            - name: ELEVENLABS_VOICE_ID
              value: "pMsXgVXv3BLzUgSXRplE"
            - name: LANGFUSE_BASE_URL
              value: "https://us.cloud.langfuse.com"
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef: { name: DEEPGRAM_API_KEY, key: latest }
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: GEMINI_API_KEY, key: latest }
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef: { name: ELEVENLABS_API_KEY, key: latest }
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef: { name: SUPABASE_KEY, key: latest }
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: TWILIO_AUTH_TOKEN, key: latest }
            - name: TWILIO_VERIFY_SERVICE_SID
              valueFrom:
                secretKeyRef: { name: TWILIO_VERIFY_SERVICE_SID, key: latest }
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: LANGFUSE_PUBLIC_KEY, key: latest }
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: LANGFUSE_SECRET_KEY, key: latest }
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef: { name: GOOGLE_MAPS_API_KEY, key: latest }

        # ====================================================
        # 2. SIDECAR: MCP Data Server (FastMCP)
        # We override the Dockerfile CMD to boot the MCP script
        # ====================================================
        - name: mcp-server
          image: us-west4-docker.pkg.dev/gen-lang-client-0063140545/cloud-run-source-deploy/hotel-concierge-voice-agent:latest
          command: ["python", "mcp_server.py"]
          env:
            - name: SUPABASE_URL
              value: "https://evabhvbuvauttgvzplpf.supabase.co"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: GEMINI_API_KEY, key: latest }
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef: { name: GOOGLE_MAPS_API_KEY, key: latest }
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef: { name: SUPABASE_KEY, key: latest }
          startupProbe:
            # Safely check if port 8001 has opened before letting Voice Agent boot
            tcpSocket:
              port: 8001
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 10