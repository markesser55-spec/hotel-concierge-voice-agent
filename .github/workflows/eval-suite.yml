name: Eval Suite

on:
  pull_request:

concurrency:
  group: eval-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden-conversations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-eval.txt

      - name: Run golden conversation evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest evals/tests/test_golden_conversations.py -v
